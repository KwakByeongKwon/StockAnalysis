<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>StockAnalysis PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      margin-bottom: 20px;
    }
    .title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .desc { font-size: 12px; color: #a1a1aa; margin-bottom: 24px; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">S</div>
  <h1 class="title">StockAnalysis PRO</h1>
  <p class="desc">로컬 주식 터미널에 연결 중입니다...</p>
  <div class="spinner"></div>

  <script>
    // 로컬 Next.js 서버로 즉시 리다이렉트
    setTimeout(function() {
      window.location.href = "http://192.168.45.95:3000";
    }, 500);
  </script>
</body>
</html>
