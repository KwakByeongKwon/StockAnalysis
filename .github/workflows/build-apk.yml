name: Build Android APK (StockAnalysis PRO)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: stock-analysis-charts/package-lock.json

      - name: Install Dependencies & Sync Capacitor
        run: |
          cd stock-analysis-charts
          npm install
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd stock-analysis-charts/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload StockAnalysis APK
        uses: actions/upload-artifact@v4
        with:
          name: StockAnalysis-PRO-v1.0-apk
          path: stock-analysis-charts/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
